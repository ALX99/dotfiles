id = "dotfiles.git-main-status"
name = "Git main status"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Fetch upstream refs and safely pull open worktrees for Herdr's native status"
platforms = ["macos", "linux"]

[[startup]]
command = ["python3", "refresh.py", "refresh-all"]

[[actions]]
id = "refresh"
title = "Fetch and pull open repositories"
contexts = ["workspace"]
command = ["python3", "refresh.py", "refresh-all", "--notify"]

[[events]]
on = "workspace.created"
command = ["python3", "refresh.py", "refresh-workspace"]

[[events]]
on = "workspace.focused"
command = ["python3", "refresh.py", "refresh-workspace"]

[[events]]
on = "worktree.opened"
command = ["python3", "refresh.py", "refresh-workspace"]
