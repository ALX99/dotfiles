id = "dotfiles.git-main-status"
name = "Git main status"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Fetch upstream refs and safely pull open worktrees for Herdr's native status"
platforms = ["macos", "linux"]

[[startup]]
command = ["python3", "refresh.py", "refresh-all"]

# Interactive creation and worktree opens focus the new workspace, so one
# hook covers all of them; extra hooks would race each other on one repo.
[[events]]
on = "workspace.focused"
command = ["python3", "refresh.py", "refresh-workspace"]
