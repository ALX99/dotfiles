# Omarchy-compatible base configuration with repository customizations.
# Keep the terminal/ANSI theme and tmux-compatible defaults so Omarchy theme
# changes continue to flow through the terminal palette.

[theme]
name = "terminal"

[theme.custom]
panel_bg = "black"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "ctrl+space"

# Omarchy/tmux-compatible controls
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"
copy_mode = "prefix+["
split_horizontal = ["prefix+h", "alt+enter"]
split_vertical = ["prefix+v", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"
resize_mode = ["prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]
resize_pane_left = "ctrl+alt+shift+left"
resize_pane_down = "ctrl+alt+shift+down"
resize_pane_up = "ctrl+alt+shift+up"
resize_pane_right = "ctrl+alt+shift+right"
rename_pane = "prefix+shift+o"

# Colemak-DH navigation additions
navigate_pane_left = "m"
navigate_pane_down = "n"
navigate_pane_up = "e"
navigate_pane_right = "i"
swap_pane_down = "prefix+n"
swap_pane_up = "prefix+e"
swap_pane_left = "prefix+shift+left"
swap_pane_right = "prefix+shift+right"

# Windows -> tabs
new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+k"
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Sessions -> workspaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

[ui]
accent = "blue"
pane_gaps = false
pane_outer_borders = false
pane_scrollbars = false
confirm_close = false
prompt_new_tab_name = false
mouse_capture = true
tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]
window_title = "{hostname}: {workspace}"

# Repository UI additions that do not replace Omarchy's core defaults.
sidebar_width = 24
sidebar_min_width = 18
sidebar_max_width = 36
sidebar_collapsed_mode = "compact"
show_agent_labels_on_pane_borders = false
hide_tab_bar_when_single_tab = false
agent_panel_sort = "spaces"

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  [
    { token = "$pr_draft", fg = "yellow" },
    { token = "$pr_open", fg = "blue" },
    { token = "$pr_merged", fg = "green" },
    { token = "$pr_closed", fg = "red" },
    "branch",
    "git_status",
  ],
]

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[session]
resume_agents_on_restore = true

[remote]
manage_ssh_config = true

[advanced]
scrollback_limit_bytes = 100_000_000

# Additional repository commands.
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
description = "open lazygit"
width = "100%"
height = "100%"

[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "git status --short --branch; printf '\\nPress any key to close...'; read -r -n 1"
description = "show git status"
width = "90%"
height = "80%"

[[keys.command]]
key = "alt+t"
type = "popup"
command = 'HERDR_SCRATCH_POPUP=1 exec "${SHELL:-bash}"'
description = "toggle scratch shell"
width = "95%"
height = "95%"

[[keys.command]]
key = "alt+o"
type = "popup"
command = 'if command -v pi >/dev/null 2>&1; then exec pi; else exec claude; fi'
description = "open pi or claude"
width = "95%"
height = "95%"

[[keys.command]]
key = "prefix+shift+t"
type = "plugin_action"
command = "dotfiles.tmpsh.spawn"
description = "spawn tmpsh space (temp folder)"

[[keys.command]]
key = "prefix+shift+u"
type = "plugin_action"
command = "dotfiles.git-pr-status.refresh"
description = "refresh GitHub PR status"

[[keys.command]]
key = "prefix+shift+y"
type = "plugin_action"
command = "dotfiles.git-pr-status.open"
description = "open GitHub PR for worktree"
