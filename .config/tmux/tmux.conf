# Global options

set -g prefix M-a   # Prefix key
set -g base-index 1 # Start index at 1 and not 0
set -g renumber-windows on # Auto-renumber when windows are closed
set-option -g set-titles on
set-option -g default-command bash # Some hack to get PS1 to load correctly in .bashrc

set-option -a terminal-features 'xterm-256color:RGB' # Lets neovim know that we support 24-bit color

set -g allow-passthrough on
set -g extended-keys on
set -g extended-keys-format csi-u
set -g xterm-keys on
set -g status-keys vi
set -g history-limit 200000
set -g mouse on
set -g buffer-limit 500000000
if-shell 'test "$(uname)" = "Darwin"' \
  'set -g copy-command pbcopy' \
  'set -g copy-command wl-copy'

# suggested by :checkhealth
set-option -g focus-events on
set-option -sg escape-time 10

set-window-option -g mode-keys vi


# Visual mode vim bindings
bind-key -T copy-mode-vi m send-keys -X cursor-left
bind-key -T copy-mode-vi n send-keys -X cursor-down
bind-key -T copy-mode-vi e send-keys -X cursor-up
bind-key -T copy-mode-vi i send-keys -X cursor-right

# Searching
bind-key -T copy-mode-vi L send-keys -X search-reverse
bind-key -T copy-mode-vi l send-keys -X search-again

bind -T copy-mode-vi Escape if-shell -F '#{selection_present}' \
    'send-keys -X clear-selection' \
    'send-keys -X cancel'
bind -T copy-mode-vi q if-shell -F '#{selection_present}' \
    'send-keys -X clear-selection' \
    'send-keys -X cancel'

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
# bind-key -T vi-copy 'y' copy-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel -P

# Use Alt-vim keys without prefix key to switch panes
bind -n M-m select-pane -L
bind -n M-n select-pane -D
bind -n M-e select-pane -U
bind -n M-i select-pane -R
bind -T popup WheelUpPane if-shell -F '#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}' \
    'send-keys -M' \
    'copy-mode -e'

bind -n M-Tab switch-client -l # switch to last session

# Move up/down
bind -r -T prefix n swap-pane -D
bind -r -T prefix e swap-pane -U

# Select next/previous pane
bind -T prefix i select-window -n
bind -T prefix m select-window -p

# Splitting (why tf are they reversed lol)
bind -T prefix s splitw -v
bind -T prefix v splitw -h

# Features
bind -T prefix g popup -d '#{pane_current_path}' -E -w 100% -h 100% lazygit # lazygit
bind -T prefix G display-popup -k -T 'git status' -d '#{pane_current_path}' -w 90% -h 80% 'git status --short --branch; printf "\nPress any key to close..."'
bind -T prefix H run-shell "tmux-history" # history
bind -n M-g run-shell -b "tmux-go-session" # switch to a different session

# Popup terminal and pi/claude
bind -T popup -n M-t detach
bind -T popup -n M-o detach
bind -n M-t display-popup -T '+#S' -w 95% -h 95% -E ~/.config/tmux/session-popup
bind -n M-o if-shell -b 'command -v pi >/dev/null 2>&1' \
  'display-popup -T pi -w 95% -h 95% -E ~/.config/tmux/session-popup pi' \
  'display-popup -T claude -w 95% -h 95% -E ~/.config/tmux/session-popup claude'
bind -T prefix h switch-client -T prefix2
bind -T prefix2 t command-prompt -p "Worktree:" "new-window -n 'wt:%1' 'claude -w %1'"
bind -n M-f resize-pane -Z # toggle full screen

# Resizing
bind-key -r -T prefix M resize-pane -L
bind-key -r -T prefix N resize-pane -D
bind-key -r -T prefix E resize-pane -U
bind-key -r -T prefix I resize-pane -R

bind-key -r -T prefix b break-pane
bind-key -r -T prefix j choose-window -Z "join-pane -s "%%""
bind-key -T prefix R source-file ~/.config/tmux/tmux.conf \; display-message "source-file done"

# ----------------------------=== Theme ===--------------------------
# Twilight Bloom matches Ghostty, Herdr, Pi, PS1, and LS_COLORS.
# muted=#aa97bd red=#ff6b8a green=#78e3b0 amber=#ffd36a
# blue=#8fa8ff orchid=#e7a1ff cyan=#63e6e8 base=#18121f

set-option -g status "on"
set -g status-position top
set -g status-style "bg=#18121f,fg=#aa97bd"
set -g status-justify centre
set -g status-interval 60
set -g status-left-length 24
set -g status-right-length 40

# Status line
set -g status-left  "#[fg=#8fa8ff,bold]#S "
set -g status-right "#(~/.config/tmux/status)"

# Windows
set -g window-status-separator "#[none,fg=#aa97bd,dim] │ "
set -g window-status-style "bg=#18121f,fg=#aa97bd"
set -g window-status-format "#[none,fg=#aa97bd,dim]#I #[none,fg=#aa97bd]#W"

set -g window-status-current-style "bg=#18121f,fg=#8fa8ff,bold"
set -g window-status-current-format "#[none,fg=#8fa8ff]#I #[none,fg=#8fa8ff,bold]#W#{?window_zoomed_flag, #[none,fg=#ffd36a][Z],}"

set -g window-status-activity-style "fg=#ffd36a"
set -g window-status-bell-style "fg=#ff6b8a,bold"

# Borders
set -g pane-active-border-style "bg=#18121f,fg=#8fa8ff"
set -g pane-border-style "fg=#aa97bd,dim"

# Popups
set -g popup-border-lines rounded
set -g popup-border-style "bg=#18121f,fg=#aa97bd,dim"
set -g popup-style "bg=#18121f,fg=#fff7ff"

# Messages / prompts
set -g message-style "bg=#30203d,fg=#8fa8ff,bold"
set -g message-command-style "bg=#30203d,fg=#e8ddf1"

# Copy mode / clock
set -g mode-style "bg=#8fa8ff,fg=#18121f,bold"
set -g copy-mode-position-style "bg=#18121f,fg=#8fa8ff,bold"
set -g copy-mode-selection-style "bg=#8fa8ff,fg=#18121f,bold"
set -g copy-mode-match-style "bg=#18121f,fg=#ffd36a,bold"
set -g copy-mode-current-match-style "bg=#ffd36a,fg=#18121f,bold"
set -g clock-mode-colour "#8fa8ff"
set -g display-panes-active-colour "#8fa8ff"
set -g display-panes-colour "#aa97bd"
