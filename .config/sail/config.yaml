ui:
  pane_ratios: [1, 2, 3]
  gutter: ctime
  minimal: false
  show_hidden: false

keymap:
  bindings:
    # Navigation (Colemak additions, preserving defaults)
    nav.up: [k, up, e]
    nav.down: [j, down, n]
    nav.parent: [h, left, m]
    nav.enter: [l, right, enter, i]

    # Bookmarks: m is used for nav.parent, so move bookmark-set to b.
    bookmark.set: "b *"

    # Disable preview scroll.
    preview.scroll_up: []
    preview.scroll_down: []

    # Custom actions.
    action.archive: A
    action.open: o
    action.shell: "!"

dialog:
  accept: enter
  cancel: esc
  backspace: backspace

bookmarks:
  h: ~/
  d: ~/Downloads
  p: ~/projects

actions:
  archive:
    script: /Users/dozy/.config/sail/actions/archive
    confirm: multi
    refresh: true
    clear_selection: false
    show_output: on_error

  open:
    command: open "$@"
    confirm: never
    refresh: false
    clear_selection: false

  shell:
    script: /Users/dozy/.config/sail/actions/shell
    interactive: true
    confirm: never
    refresh: true
    clear_selection: false

# v2 does not support these v1 settings yet:
# - alt_screen
