# Shared base config. `mise run install personal` selects MISE_ENV=personal in
# login shells; Linux provisioning is explicit with `mise -E linux bootstrap`.

# On brew because they're source-built, dependency-coupled, or self-referential.
[bootstrap.packages]
"brew:bash" = {}
"brew:bash-completion@2" = {}
"brew:coreutils" = {}
"brew:curl" = {}
"brew:diffutils" = {}
"brew:findutils" = {}
"brew:gawk" = {}
"brew:gnu-sed" = {}
"brew:gnu-tar" = {}
"brew:grep" = {}
"brew:htop" = {}
"brew:stow" = {}
"brew:tree" = {}

[bootstrap.directories]
"~/.agents/skills" = {}
"~/.claude/skills" = {}
"~/Library/Keyboard Layouts" = { mode = "0700" }

# After applying, enable under System Settings → Keyboard → Text Input → + → Others.
[bootstrap.files]
"~/Library/Keyboard Layouts/Colemak-DH-ANSI.keylayout" = { source = "misc/keymaps/Colemak-DH-ANSI.keylayout", mode = "0644" }

[tools]
"aqua:cue-lang/cue" = { version = "latest", lazy = true, lazy_bins = ["cue"] } # gen:karabiner, karabiner:check
"aqua:jqlang/jq" = { version = "latest", lazy = true, lazy_bins = ["jq"] }
"aqua:mvdan/sh" = { version = "latest", lazy = true, lazy_bins = ["shfmt"] }
"aqua:koalaman/shellcheck" = { version = "latest", lazy = true, lazy_bins = ["shellcheck"] }
node = "26" # pi:check
"aqua:pnpm/pnpm" = "12" # pi:check

# Task files live in .mise/tasks/: flat entry points (install, linux-system),
# subsystem tasks (pi:check, profiles:check, shell:check, karabiner:check), internal formatter
# subtasks (fmt:cue, fmt:pi, fmt:shell), and generator subcommands (gen:<area>).
# Aggregate tasks (check, fmt) and `gen` are defined here;
# `gen` depends on every `gen:*` task, so new generators need no registration.
[tasks.check]
description = "Run all repository checks"
depends = ["karabiner:check", "pi:check", "profiles:check", "shell:check", "theme:check"]

[tasks.fmt]
description = "Run all repository formatters"
depends = [
  { task = "fmt:cue", env = { DOTFILES_FMT_DISPATCH = "fmt" } },
  { task = "fmt:pi", env = { DOTFILES_FMT_DISPATCH = "fmt" } },
  { task = "fmt:shell", env = { DOTFILES_FMT_DISPATCH = "fmt" } },
]

[tasks.gen]
description = "Run every generator (gen:<area>) task"
depends = ["gen:*"]
